<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#page-content})}">
<head><title>DSM Entries — MudStock</title></head>
<body>
<div id="page-content" th:fragment="content">
    <div class="page-header">
        <h1>Day Stock Movement Entries</h1>
        <div class="subtitle">Showing <strong th:text="${#lists.size(entries)}">0</strong> entries</div>
    </div>

    <div class="filter-bar" role="search" aria-label="Filter day stock movement entries">
        <span class="filter-bar-label">Filters</span>

        <div class="table-filter-input">
            <input id="dsmTickerSearchInput" class="table-filter-input-uppercase" list="dsmTickerOptions" type="text" placeholder="Search ticker" aria-label="Search ticker">
            <button id="addDsmTickerFilterBtn" type="button" class="btn btn-sm btn-secondary">Add ticker</button>
            <datalist id="dsmTickerOptions">
                <option th:each="ticker : ${tickers}" th:value="${ticker}"></option>
            </datalist>
        </div>

        <div class="table-filter-input">
            <input id="dsmDateFilterInput" type="date" aria-label="Filter by date">
            <button id="addDsmDateFilterBtn" type="button" class="btn btn-sm btn-secondary">Add date</button>
        </div>

        <span id="dsmActiveFilters"></span>
        <span id="dsmFilterHint" class="filter-bar-empty">Add one or more ticker/date filters and sorting stays in the browser only.</span>

        <div style="display:flex;gap:8px;align-items:center;margin-left:auto">
            <button id="clearDsmFiltersBtn" type="button" class="btn btn-sm btn-secondary">Clear all</button>
        </div>
    </div>

    <div th:if="${entries == null or #lists.isEmpty(entries)}" class="table-empty">No entries found. Run the scheduler to populate.</div>
    <div th:if="${entries != null and !#lists.isEmpty(entries)}" class="card table-wrap">
        <table id="dsm-entries-table">
            <thead>
                <tr>
                    <th>
                        <button type="button" class="btn btn-sm table-sort-btn" data-sort-key="ticker">
                            Ticker <span class="sort-indicator" data-for="ticker"></span>
                        </button>
                    </th>
                    <th>
                        <button type="button" class="btn btn-sm table-sort-btn" data-sort-key="date">
                            Date <span class="sort-indicator" data-for="date"></span>
                        </button>
                    </th>
                    <th>Open</th>
                    <th>Close</th>
                    <th>High</th>
                    <th>Low</th>
                    <th>Change %</th>
                    <th>Open Change %</th>
                    <th>Volume</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="e : ${entries}" th:attr="data-ticker=${e['ticker']}, data-date=${e['master_event_date']}, data-sort-ticker=${e['ticker']}, data-sort-date=${e['master_event_date']}">
                    <td th:attr="data-sort-value=${e['ticker']},data-filter-value=${e['ticker']}">
                        <span class="badge badge-grey" th:text="${e['ticker']}"></span>
                        <button type="button" class="filter-btn" data-field="ticker" th:data-value="${e['ticker']}" title="Filter by ticker">⊕</button>
                    </td>
                    <td th:attr="data-sort-value=${e['master_event_date']},data-filter-value=${e['master_event_date']}">
                        <span th:text="${e['master_event_date']}"></span>
                    </td>
                    <td th:text="${e['cur_day_open']}"></td>
                    <td th:text="${e['cur_day_close']}"></td>
                    <td th:text="${e['cur_day_high']}"></td>
                    <td th:text="${e['cur_day_low']}"></td>
                    <td th:text="${e['change_percent']}"></td>
                    <td th:text="${e['day_opening_change_percent']}"></td>
                    <td th:text="${e['cur_day_volume']}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        (function () {
            var table = document.getElementById('dsm-entries-table');
            if (!table) return;

            var tickerSearchInput = document.getElementById('dsmTickerSearchInput');
            var addTickerFilterBtn = document.getElementById('addDsmTickerFilterBtn');
            var dateFilterInput = document.getElementById('dsmDateFilterInput');
            var addDateFilterBtn = document.getElementById('addDsmDateFilterBtn');
            var activeFiltersWrap = document.getElementById('dsmActiveFilters');
            var filterHint = document.getElementById('dsmFilterHint');
            var clearFiltersBtn = document.getElementById('clearDsmFiltersBtn');
            var sortState = { key: null, dir: 'asc' };
            var filters = { ticker: [], date: [] };

            function normalizeValue(field, value) {
                var normalized = (value || '').trim();
                if (field === 'ticker') {
                    normalized = normalized.toUpperCase();
                }
                return normalized;
            }

            function renderFilterChips() {
                activeFiltersWrap.innerHTML = '';
                Object.keys(filters).forEach(function (field) {
                    filters[field].forEach(function (value) {
                        var chip = document.createElement('span');
                        chip.className = 'chip';

                        var typeSpan = document.createElement('span');
                        typeSpan.className = 'chip-type';
                        typeSpan.textContent = field;

                        var strong = document.createElement('strong');
                        strong.textContent = value;

                        var rmBtn = document.createElement('button');
                        rmBtn.type = 'button';
                        rmBtn.className = 'chip-remove';
                        rmBtn.title = 'Remove';
                        rmBtn.dataset.field = field;
                        rmBtn.dataset.value = value;
                        rmBtn.textContent = '✕';

                        chip.appendChild(typeSpan);
                        chip.appendChild(document.createTextNode(' '));
                        chip.appendChild(strong);
                        chip.appendChild(document.createTextNode(' '));
                        chip.appendChild(rmBtn);
                        activeFiltersWrap.appendChild(chip);
                    });
                });

                filterHint.style.display = activeFiltersWrap.children.length === 0 ? '' : 'none';
            }

            function applyFilters() {
                var rows = Array.from(table.tBodies[0].rows);
                rows.forEach(function (row) {
                    var ticker = normalizeValue('ticker', row.children[0].dataset.filterValue || '');
                    var date = normalizeValue('date', row.children[1].dataset.filterValue || '');
                    var show = true;

                    if (filters.ticker.length > 0 && !filters.ticker.some(function (value) { return ticker.includes(value); })) {
                        show = false;
                    }
                    if (show && filters.date.length > 0 && !filters.date.some(function (value) { return date.includes(value); })) {
                        show = false;
                    }

                    row.style.display = show ? '' : 'none';
                });
            }

            function addFilter(field, value) {
                var normalized = normalizeValue(field, value);
                if (!normalized) return;
                if (!filters[field].includes(normalized)) {
                    filters[field].push(normalized);
                    renderFilterChips();
                    applyFilters();
                }
            }

            function removeFilter(field, value) {
                filters[field] = filters[field].filter(function (entry) { return entry !== value; });
                renderFilterChips();
                applyFilters();
            }

            function parseSortValue(row, key) {
                if (key === 'ticker') {
                    return (row.children[0].dataset.sortValue || '').toLowerCase();
                }
                if (key === 'date') {
                    var dateText = row.children[1].dataset.sortValue || '';
                    var timestamp = Date.parse(dateText);
                    return Number.isNaN(timestamp) ? Number.NEGATIVE_INFINITY : timestamp;
                }
                return '';
            }

            function updateSortIndicators() {
                document.querySelectorAll('.sort-indicator').forEach(function (el) {
                    if (sortState.key !== el.dataset.for) {
                        el.textContent = '';
                        return;
                    }
                    el.textContent = sortState.dir === 'asc' ? '↑' : '↓';
                });
            }

            function sortTable(key) {
                var tbody = table.tBodies[0];
                if (!tbody) return;

                if (sortState.key === key) {
                    sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
                } else {
                    sortState.key = key;
                    sortState.dir = 'asc';
                }

                var rows = Array.from(tbody.rows);
                rows.sort(function (a, b) {
                    var av = parseSortValue(a, key);
                    var bv = parseSortValue(b, key);
                    if (av < bv) return sortState.dir === 'asc' ? -1 : 1;
                    if (av > bv) return sortState.dir === 'asc' ? 1 : -1;
                    return 0;
                });

                rows.forEach(function (row) { tbody.appendChild(row); });
                updateSortIndicators();
                applyFilters();
            }

            addTickerFilterBtn.addEventListener('click', function () {
                addFilter('ticker', tickerSearchInput.value);
                tickerSearchInput.value = '';
            });

            tickerSearchInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addFilter('ticker', tickerSearchInput.value);
                    tickerSearchInput.value = '';
                }
            });

            addDateFilterBtn.addEventListener('click', function () {
                addFilter('date', dateFilterInput.value);
                dateFilterInput.value = '';
            });

            clearFiltersBtn.addEventListener('click', function () {
                filters = { ticker: [], date: [] };
                renderFilterChips();
                applyFilters();
            });

            document.addEventListener('click', function (e) {
                var removeBtn = e.target.closest('.chip-remove[data-field]');
                if (removeBtn) {
                    removeFilter(removeBtn.dataset.field, removeBtn.dataset.value);
                    return;
                }

                var filterBtn = e.target.closest('.filter-btn[data-field]');
                if (filterBtn) {
                    addFilter(filterBtn.dataset.field, filterBtn.dataset.value);
                    return;
                }
            });

            document.querySelectorAll('.table-sort-btn[data-sort-key]').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    sortTable(btn.dataset.sortKey);
                });
            });

            renderFilterChips();
            applyFilters();
        })();
    </script>
</div>
</body>
</html>
