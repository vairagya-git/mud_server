<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#page-content})}">
<head><title>Option Analysis — MudStock</title></head>
<body>
<div id="page-content" th:fragment="content">
    <style>
        .mapping-tab-shell { margin-bottom: 24px; }

        .mapping-tabs {
            display:flex;
            gap:0;
            flex-wrap:wrap;
            margin: 0;
            border-bottom: 1px solid var(--border);
        }

        .mapping-tab-btn {
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
            border-radius: 8px 8px 0 0;
            padding: 8px 12px;
            margin: 0 6px -1px 0;
            cursor: pointer;
            font-size: .84rem;
            font-weight: 600;
            border-bottom-color: var(--border);
        }
        .mapping-tab-btn.active {
            background: #fff;
            border-color: #9dd59d;
            border-bottom-color: #fff;
            color: #1f5d1f;
            box-shadow: inset 0 3px 0 #63b663;
        }

        .mapping-tab-panel {
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 var(--radius) var(--radius);
            background: #fff;
            box-shadow: var(--shadow);
        }

        .mapping-tab-pane { display: none; }
        .mapping-tab-pane.active { display: block; }

        .mapping-form-section {
            max-width: 760px;
            padding: 16px 18px 14px;
        }

        .mapping-form-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--brand);
            margin-bottom: 10px;
        }

        .mapping-form-subtitle {
            margin-bottom: 10px;
            color: var(--text-muted);
            font-size: .84rem;
        }
    </style>

    <div class="page-header">
        <h1>Option Analysis</h1>
        <div class="subtitle">Analyse</div>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="mapping-tab-shell">
        <div class="mapping-tabs" role="tablist" aria-label="Option analysis modes">
            <button type="button" class="mapping-tab-btn" data-tab-target="pane-entries">Entries</button>
            <button type="button" class="mapping-tab-btn" data-tab-target="pane-new-entry">New Entry</button>
        </div>

        <div class="mapping-tab-panel">
            <div id="pane-entries" class="mapping-tab-pane">
                <div class="card table-wrap" style="margin:16px">
                    <h3 style="margin-bottom:12px">Current Entries</h3>
                    <div th:if="${entries.isEmpty()}" class="table-empty">No option analysis entries yet.</div>
                    <div th:unless="${entries.isEmpty()}" class="filter-bar" style="display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px;">
                        <div class="form-group" style="min-width:220px;margin:0;">
                            <label for="entriesTickerFilter" style="margin-bottom:4px;display:block;">Filter Ticker</label>
                            <input id="entriesTickerFilter" type="text" placeholder="Type ticker" autocomplete="off">
                        </div>
                        <button type="button" class="btn btn-secondary" data-entries-sort="ticker">Sort Ticker</button>
                        <button type="button" class="btn btn-secondary" data-entries-sort="expiration">Sort Expiration</button>
                    </div>
                    <table th:unless="${entries.isEmpty()}" id="optionAnalyseEntriesTable">
                        <thead>
                            <tr>
                                <th>Ticker</th>
                                <th>Contract</th>
                                <th>Source</th>
                                <th>Status</th>
                                <th>Expiration</th>
                                <th>Strike From</th>
                                <th>Strike To</th>
                                <th>Interval</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="e : ${entries}"
                                th:attr="data-ticker=${#strings.toUpperCase(e.ticker)},data-expiration=${e.expirationDate != null ? e.expirationDate : ''}">
                                <td><span class="badge badge-grey" th:text="${e.ticker}"></span></td>
                                <td th:text="${e.contractType}"></td>
                                <td th:text="${e.source != null ? e.source : '-'}"></td>
                                <td>
                                    <form th:if="${e.status == 'ACTIVE'}"
                                          th:action="@{/option-analysis/analyse/{id}/status(id=${e.id})}"
                                          method="post"
                                          class="inline-status-form"
                                          style="display:flex;align-items:center;gap:8px;">
                                        <select name="status" class="inline-status-select" style="min-width:130px;">
                                            <option value="ACTIVE" selected>ACTIVE</option>
                                            <option value="CLOSE">CLOSE</option>
                                        </select>
                                        <button type="submit" class="btn btn-sm btn-primary inline-status-save" style="display:none;">Save</button>
                                    </form>
                                    <span th:unless="${e.status == 'ACTIVE'}"
                                          class="badge badge-blue"
                                          th:text="${e.status != null ? e.status : '-'}"></span>
                                </td>
                                <td th:text="${e.expirationDate}"></td>
                                <td th:text="${e.strikeFrom}"></td>
                                <td th:text="${e.strikeTo}"></td>
                                <td th:text="${e.interval}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="pane-new-entry" class="mapping-tab-pane">
                <div class="mapping-form-section">
                    <h3 class="mapping-form-title">New Entry</h3>
                    <form id="optionAnalyseForm" th:action="@{/option-analysis/analyse}" method="post">
                        <input type="hidden" id="stockIdField" name="stockId" required>
                        <input type="hidden" id="statusValue" name="status" value="CREATE_CONTRACT">

                        <div class="form-group">
                            <label>Stock (Ticker)</label>
                            <input id="stockTickerInput" list="stockTickerOptions" type="text" placeholder="Search ticker" autocomplete="off" required>
                            <datalist id="stockTickerOptions">
                                <option th:each="s : ${stocks}" th:value="${s.ticker}" th:data-stock-id="${s.id}"></option>
                            </datalist>
                            <small id="stockHint" style="color:var(--text-muted)">Type a ticker and select from suggestions.</small>
                        </div>

                        <div class="form-group">
                            <label>Contract Type</label>
                            <select name="contractType" required>
                                <option value="CALL">CALL</option>
                                <option value="PUT">PUT</option>
                                <option value="BOTH">BOTH</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Source</label>
                            <select name="source" required>
                                <option value="API" selected>API</option>
                                <option value="FLAT_FILE">FLAT_FILE</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Status</label>
                            <div style="font-size:.84rem;color:var(--text-muted)">New entries are created with status: <strong id="statusLabel">CREATE_CONTRACT</strong></div>
                        </div>

                        <div class="form-group">
                            <label>Expiration Date</label>
                            <input type="date" name="expirationDate" required>
                        </div>

                        <div class="form-group">
                            <label>Strike From</label>
                            <input type="number" name="strikeFrom" step="0.0001" min="0" required>
                        </div>

                        <div class="form-group">
                            <label>Strike To</label>
                            <input type="number" name="strikeTo" step="0.0001" min="0" required>
                        </div>

                        <div class="form-group">
                            <label>Interval</label>
                            <input type="number" name="interval" step="0.01" min="0" required>
                        </div>

                        <div class="actions-bar" style="margin-top:20px">
                            <button type="submit" class="btn btn-primary">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var tabButtons = Array.from(document.querySelectorAll('.mapping-tab-btn[data-tab-target]'));
            var tabPanes = Array.from(document.querySelectorAll('.mapping-tab-pane'));
            var form = document.getElementById('optionAnalyseForm');
            var tickerInput = document.getElementById('stockTickerInput');
            var stockIdField = document.getElementById('stockIdField');
            var stockHint = document.getElementById('stockHint');
            var statusValue = document.getElementById('statusValue');
            var statusLabel = document.getElementById('statusLabel');
            var entriesTable = document.getElementById('optionAnalyseEntriesTable');
            var entriesTickerFilter = document.getElementById('entriesTickerFilter');
            var entriesSortButtons = Array.from(document.querySelectorAll('[data-entries-sort]'));
            var entriesSortState = { field: 'ticker', dir: 'asc' };

            function setActiveTab(tabName) {
                tabPanes.forEach(function (pane) { pane.classList.remove('active'); });
                tabButtons.forEach(function (btn) { btn.classList.remove('active'); });

                var activeButton = tabButtons.find(function (btn) { return btn.dataset.tabTarget === tabName; });
                if (activeButton) activeButton.classList.add('active');

                var activePane = document.getElementById(tabName);
                if (activePane) activePane.classList.add('active');

                if (window.location.hash !== '#' + tabName) {
                    history.replaceState(null, '', '#' + tabName);
                }
            }

            function syncStatus() {
                var value = 'CREATE_CONTRACT';
                statusValue.value = value;
                statusLabel.textContent = value;
            }

            function syncStockId() {
                var ticker = (tickerInput.value || '').trim();
                if (!ticker) {
                    stockIdField.value = '';
                    stockHint.textContent = 'Type a ticker and select from suggestions.';
                    return;
                }

                var option = document.querySelector('#stockTickerOptions option[value="' + CSS.escape(ticker) + '"]');
                if (!option) {
                    stockIdField.value = '';
                    stockHint.textContent = 'Ticker not found. Please select a valid ticker from suggestions.';
                    return;
                }

                stockIdField.value = option.dataset.stockId || '';
                stockHint.textContent = stockIdField.value ? 'Selected stock_id: ' + stockIdField.value : 'Ticker selected.';
            }

            function getSortableValue(row, field) {
                if (field === 'expiration') {
                    return (row.dataset.expiration || '').trim();
                }
                return (row.dataset.ticker || '').trim();
            }

            function updateEntriesSortLabels() {
                entriesSortButtons.forEach(function (btn) {
                    var field = btn.getAttribute('data-entries-sort');
                    var isActive = field === entriesSortState.field;
                    var arrow = isActive ? (entriesSortState.dir === 'asc' ? ' ↑' : ' ↓') : '';
                    if (field === 'ticker') {
                        btn.textContent = 'Sort Ticker' + arrow;
                    }
                    if (field === 'expiration') {
                        btn.textContent = 'Sort Expiration' + arrow;
                    }
                });
            }

            function applyEntriesFilterAndSort() {
                if (!entriesTable) return;
                var tbody = entriesTable.querySelector('tbody');
                if (!tbody) return;

                var query = ((entriesTickerFilter && entriesTickerFilter.value) || '').trim().toUpperCase();
                var rows = Array.from(tbody.querySelectorAll('tr'));

                rows.sort(function (a, b) {
                    var aValue = getSortableValue(a, entriesSortState.field);
                    var bValue = getSortableValue(b, entriesSortState.field);
                    var cmp = aValue.localeCompare(bValue, undefined, { sensitivity: 'base' });
                    return entriesSortState.dir === 'asc' ? cmp : -cmp;
                });

                rows.forEach(function (row) {
                    var ticker = (row.dataset.ticker || '').toUpperCase();
                    var matchesTicker = !query || ticker.indexOf(query) !== -1;
                    row.style.display = matchesTicker ? '' : 'none';
                    tbody.appendChild(row);
                });
            }

            tabButtons.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    setActiveTab(btn.dataset.tabTarget);
                });
            });

            document.querySelectorAll('.inline-status-form').forEach(function (statusForm) {
                var statusSelect = statusForm.querySelector('.inline-status-select');
                var saveButton = statusForm.querySelector('.inline-status-save');
                if (!statusSelect || !saveButton) return;

                function syncInlineSave() {
                    var shouldShow = statusSelect.value === 'CLOSE';
                    saveButton.style.display = shouldShow ? '' : 'none';
                }

                statusSelect.addEventListener('change', syncInlineSave);
                syncInlineSave();
            });

            if (entriesTickerFilter) {
                entriesTickerFilter.addEventListener('input', applyEntriesFilterAndSort);
            }

            entriesSortButtons.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var nextField = btn.getAttribute('data-entries-sort');
                    if (entriesSortState.field === nextField) {
                        entriesSortState.dir = entriesSortState.dir === 'asc' ? 'desc' : 'asc';
                    } else {
                        entriesSortState.field = nextField;
                        entriesSortState.dir = 'asc';
                    }
                    updateEntriesSortLabels();
                    applyEntriesFilterAndSort();
                });
            });

            tickerInput.addEventListener('input', syncStockId);
            tickerInput.addEventListener('change', syncStockId);

            form.addEventListener('submit', function (e) {
                syncStockId();
                syncStatus();
                if (!stockIdField.value) {
                    e.preventDefault();
                    stockHint.textContent = 'Please select a valid ticker from suggestions before saving.';
                }
            });

            var hashTab = (window.location.hash || '').replace('#', '').trim();
            var initialTab = tabPanes.some(function (pane) { return pane.id === hashTab; }) ? hashTab : 'pane-entries';
            setActiveTab(initialTab);
            syncStatus();
            updateEntriesSortLabels();
            applyEntriesFilterAndSort();
        })();
    </script>
</div>
</body>
</html>
