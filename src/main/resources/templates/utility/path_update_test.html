<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#page-content})}">
<head><title>Utility Bucket Timestamp Test - MudStock</title></head>
<body>
<div id="page-content" th:fragment="content">
    <div class="page-header">
        <h1>Utility</h1>
        <div class="subtitle">Bucket Update Timestamp Test</div>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="card" style="max-width:860px;">
        <form th:action="@{/utility/path-update/test}" method="get">
            <div class="form-group">
                <label for="date">Date</label>
                <input id="date" name="date" type="date" th:value="${selectedDate}" required />
            </div>
            <div class="form-group">
                <label for="ticker">Ticker</label>
                <input id="ticker" name="ticker" type="text" th:value="${selectedTicker}" placeholder="MU" required />
            </div>
            <div class="form-group">
                <label for="limit">Limit</label>
                <input id="limit" name="limit" type="number" min="1" max="2000" step="1" th:value="${selectedLimit}" />
            </div>
            <div class="actions-bar" style="margin-top:20px;">
                <button type="submit" class="btn btn-primary">Check Timestamp & Load Rows</button>
            </div>
        </form>
    </div>

    <div class="card" th:if="${bucketInfo != null}" style="max-width:860px;">
        <div style="font-weight:700;margin-bottom:10px;">S3 Object Metadata</div>
        <table>
            <tbody>
            <tr><td>Bucket</td><td th:text="${bucketInfo.bucket}"></td></tr>
            <tr><td>Endpoint</td><td th:text="${bucketInfo.endpoint}"></td></tr>
            <tr><td>Object Key</td><td th:text="${bucketInfo.objectKey}"></td></tr>
            <tr><td>Bucket Update Timestamp</td><td th:text="${bucketInfo.lastModified}"></td></tr>
            <tr><td>Content Length</td><td th:text="${bucketInfo.contentLength}"></td></tr>
            </tbody>
        </table>
    </div>

    <div class="card" th:if="${optionData != null}" style="max-width:1200px;">
        <div style="font-weight:700;margin-bottom:10px;">Ticker Records</div>
        <div class="subtitle" style="margin-bottom:12px;">
            Ticker: <strong th:text="${optionData.ticker}">MU</strong>,
            Matches: <strong th:text="${optionData.recordCount}">0</strong>
        </div>

        <div th:if="${optionData.recordCount == 0}" class="table-empty">No matching rows found in the file.</div>

        <table th:if="${optionData.recordCount > 0}">
            <thead>
            <tr>
                <th>Ticker</th>
                <th>Volume</th>
                <th>Open</th>
                <th>Close</th>
                <th>High</th>
                <th>Low</th>
                <th>Window Start</th>
                <th>Transactions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${optionData.records}">
                <td th:text="${row.ticker}"></td>
                <td th:text="${row.volume}"></td>
                <td th:text="${row.open}"></td>
                <td th:text="${row.close}"></td>
                <td th:text="${row.high}"></td>
                <td th:text="${row.low}"></td>
                <td th:text="${row.window_start}"></td>
                <td th:text="${row.transactions}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
